name: Build CH75K

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: dist/CH75K-Linux-x86_64
          - os: macos-15
            asset: dist/CH75K.app/Contents/MacOS/CH75K
          - os: macos-15-intel
            asset: dist/CH75K.app/Contents/MacOS/CH75K
          - os: windows-2025
            asset: dist/CH75K-Windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Linux WebView and virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 xauth xvfb
      - run: python -m pip install -r requirements-build.txt
      - name: Install Windows WebView bindings
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-windows.txt
      - run: python -m unittest discover -s tests -v
      - name: Build Windows or Linux standalone
        if: runner.os != 'macOS'
        run: python build.py --output dist --standalone
      - name: Build macOS app from source
        if: runner.os == 'macOS'
        run: python build.py --output dist
      - name: Ensure Microsoft WebView2 Runtime for the Windows smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($key in "HKLM:\SOFTWARE\WOW6432Node\$client", "HKCU:\SOFTWARE\$client") {
            $version = Get-ItemPropertyValue -Path $key -Name pv -ErrorAction SilentlyContinue
            if ($version -and [version]$version -gt [version]'0.0.0.0') {
              Write-Output "WebView2 Runtime $version"
              return
            }
          }
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -ne 'Microsoft Corporation') {
            throw 'WebView2 Runtime bootstrapper signature verification failed.'
          }
          $setup = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -PassThru -Wait
          if ($setup.ExitCode -ne 0) {
            throw "WebView2 Runtime installation failed with exit code $($setup.ExitCode)."
          }
      - name: Verify and run the built application
        shell: bash
        env:
          BUILD_ASSET: ${{ matrix.asset }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            GDK_BACKEND=x11 xvfb-run -a python tests/package_smoke.py --standalone "$BUILD_ASSET"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            python tests/package_smoke.py "$BUILD_ASSET"
          else
            python tests/package_smoke.py --standalone "$BUILD_ASSET"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os != 'macOS'
        with:
          path: ${{ matrix.asset }}
          archive: false
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ch75k-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the release tag comes from the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$DEFAULT_BRANCH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
          skip-decompress: true
          digest-mismatch: error
      - name: Calculate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          assets=(
            CH75K-Linux-x86_64
            CH75K-Windows-x86_64.exe
          )
          cmp <(printf '%s\n' "${assets[@]}" | LC_ALL=C sort) \
              <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && -s "$asset" && ! -L "$asset" ]]
          done
          sha256sum -- "${assets[@]}" > SHA256SUMS
      - name: Sign build provenance for the assets and checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/CH75K-*
            release-assets/SHA256SUMS
      - name: Verify provenance and publish the release
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check --strict SHA256SUMS
          for asset in CH75K-* SHA256SUMS; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done

          # Resolve both annotated and lightweight tags again after building.
          tagged_commit=$(git ls-remote --exit-code origin "$GITHUB_REF" "${GITHUB_REF}^{}" |
            awk -v ref="$GITHUB_REF" '$2 == ref { tag = $1 } $2 == ref "^{}" { commit = $1 }
              END { print (commit != "" ? commit : tag) }')
          [[ "$tagged_commit" == "$(git rev-parse "$GITHUB_SHA^{commit}")" ]]

          gh release create "$GITHUB_REF_NAME" CH75K-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "CH75K Studio $GITHUB_REF_NAME" --notes-file - <<EOF
          - Linux x86-64는 \`CH75K-Linux-x86_64\`를 내려받아 \`chmod +x CH75K-Linux-x86_64\` 후 실행합니다.
          - Windows x86-64는 \`CH75K-Windows-x86_64.exe\`를 실행합니다.
          - macOS는 [Quick Start]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#quick-start)의 순서대로 소스에서 빌드합니다.

          [설치 및 사용 안내]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md)

          ### 다운로드 검증

          SHA256SUMS와 OS에 맞는 파일을 함께 다운로드하세요.
          GitHub CLI로 SHA256SUMS의 서명 출처를 확인할 수 있습니다.

          \`\`\`sh
          gh attestation verify SHA256SUMS --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/build.yml --source-ref $GITHUB_REF --source-digest $GITHUB_SHA --deny-self-hosted-runners
          \`\`\`

          검증된 SHA256SUMS의 값과 다운로드한 파일의 SHA-256을 비교하세요.
          Linux에서 \`sha256sum <파일>\`, macOS에서 \`shasum -a 256 <파일>\`, Windows PowerShell에서 \`Get-FileHash <파일> -Algorithm SHA256\`을 실행합니다.
          EOF
